name: care_label_scanner
description: 케어라벨을 촬영하면 OCR로 영문숫자 코드를 자동 인식하고, 인식 결과를 리스트로 누적한 뒤 엑셀 파일로 내보내는 앱입니다.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # 카메라 촬영
  camera: ^0.10.6

  # 온디바이스 OCR (인터넷 연결 없이 동작)
  google_mlkit_text_recognition: ^0.13.0

  # 엑셀(.xlsx) 파일 생성
  excel: ^4.0.6

  # 생성된 파일 공유(카카오톡/이메일/저장 등)
  share_plus: ^7.2.2

  # 앱 문서 폴더 경로 조회
  path_provider: ^2.1.3

  # 날짜 포맷
  intl: ^0.19.0

  # 고유 ID 생성
  uuid: ^4.4.0

  # 스캔 목록을 기기에 저장(앱을 껐다 켜도 기록이 남도록)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 상품바코드조회.xlsx를 변환한 상품 마스터 데이터 (오프라인 조회용)
  assets:
    - assets/product_barcodes.json
